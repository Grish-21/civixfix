{% extends "base.html" %}
{% block title %}413 File Exceeds Limit{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger">413</h1>
        <h3 class="fw-bold mb-3">Uploaded Image Exceeds Capacity</h3>
        <p class="text-muted lead mx-auto mb-4" style="max-width: 500px;">
            The uploaded photographic file exceeds the maximum allowable capacity limit of 5 Megabytes (MB).
        </p>
        <div class="d-flex justify-content-center gap-3">
            <button onclick="history.back()" class="btn btn-primary px-4"><i class="fas fa-arrow-left me-2"></i>Go Back &amp; Select Smaller File</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary px-4"><i class="fas fa-home me-2"></i>Home</a>
        </div>
    </div>
</div>
{% endblock %}
