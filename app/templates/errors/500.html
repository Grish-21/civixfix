{% extends "base.html" %}
{% block title %}500 Internal Error{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-warning">500</h1>
        <h3 class="fw-bold mb-3">Internal System Error</h3>
        <p class="text-muted lead mx-auto mb-4" style="max-width: 500px;">
            An unexpected error occurred while processing the transaction. Database modifications have been safely rolled back.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4"><i class="fas fa-home me-2"></i>Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
