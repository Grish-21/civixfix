services:
  - type: web
    name: civicfix
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: CIVICFIX_SECRET_KEY
        generateValue: true
      - key: CIVICFIX_DATA_DIR
        value: /tmp/civicfix-data
      - key: CIVICFIX_UPLOAD_DIR
        value: /tmp/civicfix-uploads
      - key: CIVICFIX_ADMIN_PASSWORD
        sync: false
